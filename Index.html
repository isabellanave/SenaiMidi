<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI MIDI</title>
    <link rel="stylesheet" href="styles/style.css">
   <link rel="shortcut icon" href="assets/images/bateria.png" type="image/x-icon">
</head>
<body>
    <h1> Senai Midi</h1>
    <section class="teclado">
        <button class="tecla tecla_Pom"> Pom </button>
        <button class="tecla tecla_Clap"> Clap </button>
        <button class="tecla tecla_Tim"> Tim </button>

        <button class="tecla tecla_Puff"> Puff </button>
        <button class="tecla tecla_Splach"> Splach </button>
        <button class="tecla tecla_Toim"> Toim </button>

        <button class="tecla tecla_Psh"> Psh</button>
        <button class="tecla tecla_Tic"> Tic</button>
        <button class="tecla tecla_Tom"> Tom </button>

    </section>
      <audio src="./assets/sounds/keyq.wav" id="som_tecla_Pom"></audio>
    <audio src="./assets/sounds/keyw.wav" id="som_tecla_Clap"></audio>
    <audio src="./assets/sounds/keye.wav" id="som_tecla_Tim"></audio>

    <audio src="./assets/sounds/keya.wav" id="som_tecla_Puff"></audio>
    <audio src="./assets/sounds/keys.wav" id="som_tecla_Splach"></audio>
    <audio src="./assets/sounds/keyd.wav" id="som_tecla_Toim"></audio>

    <audio src="./assets/sounds/keyz.wav" id="som_tecla_Psh"></audio>
    <audio src="./assets/sounds/keyx.wav" id="som_tecla_Tic"></audio>
    <audio src="./assets/sounds/keyc.wav" id="som_tecla_Tom"></audio>


    <script src="script/app.js"></script>
</body>
